name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the Pages entry
        run: |
          cp site-entry.html index.html
          npm run build
          cp dist/index.html index.html
          rm -rf assets
          cp -R dist/assets assets
      - name: Publish compiled site at the Pages root
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f index.html assets
          git diff --cached --quiet || git commit -m 'chore: publish game site [skip ci]'
          git push
